<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Node 1a: SOTA models -->
  <rect x="20" y="20" width="230" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="135" y="45" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1e1b4b">SOTA time-series models</text>
  <text x="135" y="66" text-anchor="middle" font-size="11.5" fill="#4338ca">DLinear · iTransformer</text>
  <text x="135" y="82" text-anchor="middle" font-size="11.5" fill="#4338ca">TimesNet · +25 more</text>

  <!-- Node 1b: Foundation models -->
  <rect x="20" y="108" width="230" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="135" y="133" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1e1b4b">Foundation models</text>
  <text x="135" y="154" text-anchor="middle" font-size="11.5" fill="#4338ca">Timer · MOMENT · TTM</text>
  <text x="135" y="170" text-anchor="middle" font-size="11.5" fill="#4338ca">CALF · GPT4TS · TimeLLM</text>

  <text x="135" y="205" text-anchor="middle" font-size="12" fill="#6b7280">any callable PyTorch model</text>

  <line x1="250" y1="56" x2="298" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="144" x2="298" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: tslens -->
  <rect x="365" y="65" width="230" height="105" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="480" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#164e63">tslens</text>
  <text x="480" y="126" text-anchor="middle" font-size="12.5" fill="#155e75">13+ attribution methods</text>
  <text x="480" y="148" text-anchor="middle" font-size="12.5" fill="#155e75">one .attribute() interface</text>

  <line x1="595" y1="118" x2="668" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: Saliency map -->
  <rect x="675" y="68" width="260" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="805" y="103" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Saliency map</text>
  <text x="805" y="126" text-anchor="middle" font-size="13" fill="#166534">(batch, n_output,</text>
  <text x="805" y="144" text-anchor="middle" font-size="13" fill="#166534">seq_len, n_features)</text>

  <text x="480" y="228" text-anchor="middle" font-size="12.5" fill="#6b7280">when and where the model found evidence for its prediction</text>
</svg>
